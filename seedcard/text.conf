# SeedCard engraving text
#
# Edit the values below, then rebuild the SD-card image. The values are built
# into the controller program, so a released image always engraves the same
# text and its checksum still identifies exactly what it does.
#
# The seed words, word numbers, master fingerprint and key number (1/2) are
# never taken from this file. They always come from the seed and the wallet.
#
# Allowed characters: A-Z 0-9 space and  : , / ' . ( ) [ ] { } # * @ -
# Lower-case letters are turned into capitals. Anything else is rejected when
# the program is built and tested (go test ./...), so a typo can't reach a plate.

# Short mark engraved where Seed Hammer puts its version ("V1").
# On the credit-card plate (SH01) it runs up the left edge, above the fingerprint.
# 1 to 4 characters.
version_mark = SC

# Title engraved on the seed side (on SH01: up the right edge).
# Leave empty to use the wallet name from the scanned descriptor, as Seed Hammer does.
# Up to 18 characters.
title =

# Engrave the SeedQR on the seed side: yes or no.
# SeedCard plates carry the words only.
seed_qr = no
