name: "Build image"
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: DeterminateSystems/magic-nix-cache-action@v15
    - name: Set version to GITHUB_SHA
      if: ${{ github.ref_type != 'tag' }}
      run: echo "version=${{ github.sha }}" >> $GITHUB_ENV
    - name: Set version to GITHUB_REF_NAME
      if: ${{ github.ref_type == 'tag' }}
      run: echo "version=${{ github.ref_name }}" >> $GITHUB_ENV
    - run: nix build -L
    - run: nix run -L .#stamp-release ${{ env.version }}
    - name: SHA-256 of the image
      run: sha256sum seedhammer-${{ env.version }}.img | tee seedhammer-${{ env.version }}.img.sha256
    - uses: actions/upload-artifact@v4
      with:
        name: seedhammer-${{ env.version }}.img
        path: |
          seedhammer-${{ env.version }}.img
          seedhammer-${{ env.version }}.img.sha256
